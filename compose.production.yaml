services:
  web:
    image: "${PRODUCTION_IMAGE:?immutable image required}"
    user: node
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    env_file:
      - path: "${PRODUCTION_ENV_FILE:?production env file required}"
        required: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    networks:
      - reverse-proxy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health')
          .then(async (response) => {
            if (!response.ok || (await response.json()).status !== 'ok')
              process.exit(1);
          })
          .catch(() => process.exit(1));
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  reverse-proxy:
    external: true
    name: "${PRODUCTION_PROXY_NETWORK:?external proxy network required}"
