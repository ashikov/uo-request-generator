services:
  request-generator:
    build:
      context: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    # Ограничивает локальный объём логов встроенной ротацией json-file:
    # один текущий файл и два архива по 10 МБ (итог около 30 МБ).
    # К файлам logging driver обращаться внешними инструментами не следует.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
